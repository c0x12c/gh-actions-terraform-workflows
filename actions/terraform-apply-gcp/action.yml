name: "Generalized Terraform Apply Workflow"
description: "A reusable action for running Terraform plan in any environment"

inputs:
  gcp_project_id:
    description: "GCP Project ID to use"
    required: true
  gcp_service_account:
    description: "The GCP Service Account to use for authentication"
    required: true
  gcp_workload_identity_provider:
    description: "The GCP Workload Identity Provider to use"
    required: true
  environment:
    description: "The environment to use (e.g., dev, prod)"
    required: true
  python_version:
    description: "Python version to use"
    required: false
    default: "3.12"
  secret_filter:
    description: "The filter name to use with git-secret-protector"
    required: false
    default: ""
  slack_webhook_url:
    description: "The Slack Webhook URL for posting deployment notifications"
    required: false
    default: ""
  terraform_version:
    description: "Terraform version to use"
    required: false
    default: "1.8.4"
  working_dir:
    description: "The working directory for Terraform files"
    required: true
  refresh:
    description: "Whether to refresh the state before applying (true/false)."
    required: false
    default: "true"
  github_token:
    description: "GitHub Token required to post comments to PR"
    required: false
    default: ""
  comment_mode:
    description: >-
      How to post the apply comment. "sticky" keeps one comment per apply and updates it
      in place, so repeated pushes do not bury the PR under a comment per environment
      per run. Set "new" (default) to append a fresh comment on every run instead.
    required: false
    default: "new"
  comment_marker:
    description: >-
      Hidden HTML marker identifying the sticky comment to update. Only used when
      comment_mode is "sticky". Left empty it derives
      "<!-- terraform-apply:<environment>:<working_dir> -->", which keeps concurrent applies
      on the same PR in separate comments - and keeps an apply comment from overwriting the
      plan comment for the same environment. Set it explicitly to group them differently. It
      cannot be defaulted literally here because the inputs context is unavailable when
      GitHub evaluates input defaults.
    required: false
    default: ""
  pr_number:
    description: >-
      PR number to comment on. Defaults to the PR from the triggering event; set it
      explicitly so a workflow_dispatch-driven apply can still post a comment.
    required: false
    default: ""
  num_commits:
    description: >-
      How many recent commits the Slack notification lists, so an alert says what was being
      applied. The caller's checkout must be at least this deep (actions/checkout defaults to
      fetch-depth 1, which leaves only the head commit to list).
    required: false
    default: "3"

outputs:
  error_detail:
    description: >-
      The terraform error from a failed apply (from the first "Error:" block onward, capped at
      2000 bytes), so a caller can render its own failure notification without scraping the job
      log. Empty when the apply succeeded.
    value: ${{ steps.tf_apply.outputs.error_detail }}

runs:
  using: "composite"
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform_version }}

    - name: Config Terraform plugin cache
      shell: bash
      run: |
        echo 'plugin_cache_dir="$HOME/.terraform.d/plugin-cache"' >~/.terraformrc
        mkdir --parents ~/.terraform.d/plugin-cache

    - name: Cache Terraform
      uses: actions/cache@v5
      with:
        path: |
          ~/.terraform.d/plugin-cache
        key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
        restore-keys: |
          ${{ runner.os }}-terraform-

    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v3
      with:
        create_credentials_file: true
        project_id: ${{ inputs.gcp_project_id }}
        service_account: ${{ inputs.gcp_service_account }}
        workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}

    - name: Decrypt Secrets
      if: ${{ inputs.secret_filter != '' }}
      uses: c0x12c/gh-actions-git-secret-protector@v1
      with:
        filter: ${{ inputs.secret_filter }}

    - name: Terraform Init
      id: init
      shell: bash
      run: terraform init
      working-directory: ${{ inputs.working_dir }}

    - name: Terraform Plan
      id: plan
      shell: bash
      env:
        REFRESH: ${{ inputs.refresh }}
      # ../../ - a composite action gets the whole repo, and the script is shared with the sibling.
      run: bash "${GITHUB_ACTION_PATH}/../../scripts/gcp-plan.sh"
      continue-on-error: true
      working-directory: ${{ inputs.working_dir }}

    - name: Terraform Apply
      id: tf_apply
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      env:
        REFRESH: ${{ inputs.refresh }}
        PLAN_FILE: ${{ runner.temp }}/plan.tmp
      # ../../ - a composite action gets the whole repo, and the script is shared with the sibling.
      run: bash "${GITHUB_ACTION_PATH}/../../scripts/apply.sh"

    - name: Send Notification to Slack on success
      uses: c0x12c/gh-actions-slack-notify@v0.3.0
      if: success() && inputs.slack_webhook_url != ''
      with:
        webhook_url: ${{ inputs.slack_webhook_url }}
        num-commits: ${{ inputs.num_commits }}
        title: '✅ *${{ github.event.repository.name }} - Terraform Apply SUCCESS in ${{ inputs.environment }}*'

    - name: Send Notification to Slack on failure
      uses: c0x12c/gh-actions-slack-notify@v0.3.0
      if: failure() && inputs.slack_webhook_url != ''
      with:
        webhook_url: ${{ inputs.slack_webhook_url }}
        num-commits: ${{ inputs.num_commits }}
        title: '❌ *${{ github.event.repository.name }} - Terraform Apply FAILED in ${{ inputs.environment }}*'
        # The action fences it and escapes any fence terminator in the error - empty when the
        # run failed before the apply, which renders no section at all.
        message: ${{ steps.tf_apply.outputs.error_detail }}
        message_format: 'code'

    - name: Post Terraform Apply Results to PR
      uses: actions/github-script@v8
      if: ${{ (github.event_name == 'pull_request' || inputs.pr_number != '') && inputs.github_token != '' }}
      env:
        # Passed via env, never interpolated into the script body: consumer-controlled inputs
        # in a github-script body are a script-injection vector.
        PLAN_KIND: apply
        PLAN_ENVIRONMENT: ${{ inputs.environment }}
        PLAN_WORKING_DIR: ${{ inputs.working_dir }}
        PLAN_COMMENT_MODE: ${{ inputs.comment_mode }}
        PLAN_COMMENT_MARKER: ${{ inputs.comment_marker }}
        PLAN_PR_NUMBER: ${{ inputs.pr_number }}
        PLAN_APPLY_OUTCOME: ${{ steps.tf_apply.outcome }}
        PLAN_ACTOR: ${{ github.actor }}
        PLAN_EVENT_NAME: ${{ github.event_name }}
        PLAN_WORKFLOW: ${{ github.workflow }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          await require(`${process.env.GITHUB_ACTION_PATH}/../../scripts/post-comment.js`)({ github, context });
