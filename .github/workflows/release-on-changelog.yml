name: Release on CHANGELOG

# Auto-cut a release when a new "## [vX.Y.Z]" section lands on master: tag the version
# and move the vX.Y / vX aliases. tools/changelog-release.sh is idempotent, so a
# CHANGELOG edit that doesn't introduce a new top version is a no-op. The vX.Y.Z tag push
# then triggers auto-generate-release.yml to publish. The Update-*-Version-Tag dispatchers
# remain as a manual fallback.
on:
  push:
    branches: [ master ]
    paths: [ 'CHANGELOG.md' ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log the parsed version + verdict and push nothing.'
        type: boolean
        default: false

# Serialize releases: overlapping runs must not force-move vX / vX.Y concurrently.
concurrency:
  group: release-on-changelog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.repository_owner == 'c0x12c'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag push MUST run under the GitHub App token: a tag pushed with the default
      # GITHUB_TOKEN does not trigger auto-generate-release.yml (GitHub suppresses workflow
      # runs from the default token to avoid recursion), so the tag would land with no release.
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v3
        id: github-app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.github-app-token.outputs.token }}
          persist-credentials: true

      - name: Cut release from CHANGELOG
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          ./tools/changelog-release.sh
