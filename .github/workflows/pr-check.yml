name: PR Check

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Shellcheck scripts
        run: shellcheck actions/*/scripts/*.sh tools/*.sh

      - name: Run Tests
        run: |
          node tests/test-comment-length.js
          node tests/test-backtick-escaping.js
          node tests/test-refresh-configuration.js
          node tests/test-sticky-comment.js
          node tests/test-plan-gate.js
          node tests/test-apply-error-extract.js
          node tests/test-changelog-release.js
